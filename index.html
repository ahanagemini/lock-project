<!DOCTYPE html>
<html>
<body onload="loadSavedInfo()">
    <h2>Class Project 2FA (Auto-Save)</h2>
    
    <label>Birth Month:</label><br>
    <input type="number" id="birthMonth" placeholder="e.g. 10" min="1" max="12"><br><br>
    
    <label>Birth Day:</label><br>
    <input type="number" id="birthDay" placeholder="e.g. 28" min="1" max="31"><br><br>
    
    <button onclick="generateAndSave()">Get Current Code</button>
    <h1 id="code" style="color:green;"></h1>

    <script>
        function loadSavedInfo() {
            if (localStorage.getItem("savedMonth")) {
                document.getElementById("birthMonth").value = localStorage.getItem("savedMonth");
                document.getElementById("birthDay").value = localStorage.getItem("savedDay");
                generateAndSave();
            }
        }

        function generateAndSave() {
            let month = parseInt(document.getElementById("birthMonth").value) || 0;
            let day = parseInt(document.getElementById("birthDay").value) || 0;
            
            localStorage.setItem("savedMonth", month);
            localStorage.setItem("savedDay", day);
            
            // Get both the hour AND the minute
            let now = new Date();
            let hour = now.getHours(); 
            let minute = now.getMinutes(); // Returns 0 to 59
            
            // Updated formula: we add the current minute to the equation
            let calculation = (month + day + hour + minute) * 77 + 1000;
            let finalCode = calculation % 10000; 
            
            document.getElementById("code").innerText = String(finalCode).padStart(4, '0');
        }
    </script>
</body>
</html>
